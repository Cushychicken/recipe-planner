name: Weekly dinner plan

on:
  schedule:
    - cron: '0 23 * * 6'
      timezone: America/New_York
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'templates/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/weekly-plan.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-plan
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install template PDF renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - name: Test planner
        run: python -m unittest discover -s tests -v
      - name: Test day controls
        run: node --test tests/test_client.cjs tests/test_exporter.cjs
      - name: Generate plan and printable sheets
        run: python scripts/planner.py
      - name: Save weekly history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plans docs
          if ! git diff --staged --quiet; then
            git commit -m 'Publish weekly dinner plan [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - name: Downloadable print sheets
        uses: actions/upload-artifact@v4
        with:
          name: dinner-plan-print-sheets
          path: docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Setup status
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          recipes = json.loads(Path('data/recipes.json').read_text())
          ready = sum(r['ingredients_verified'] for r in recipes)
          print(f'## Recipe setup: {ready}/{len(recipes)} ingredient lists verified')
          print('Download the print sheets artifact above, or visit the published Pages site.')
          settings = json.loads(Path('data/settings.json').read_text())
          days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][:settings['dinners']]
          required = sum(day not in settings.get('leftovers_days', []) for day in days)
          if ready < required:
              print('**DRAFT: ingredient setup is incomplete. No shopping list is fabricated.**')
          PY
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
